---
- name: Download LibPRI source tarball
  ansible.builtin.get_url:
    url: "{{ libpri_tarball_url }}"
    dest: "{{ libpri_tarball_path }}"
    mode: "0644"

- name: Extract LibPRI source
  ansible.builtin.unarchive:
    src: "{{ libpri_tarball_path }}"
    dest: "{{ asterisk_build_base }}"
    remote_src: true

- name: Find extracted LibPRI directory
  ansible.builtin.find:
    paths: "{{ asterisk_build_base }}"
    patterns: "libpri-*"
    file_type: directory
  register: libpri_dirs

- name: Set LibPRI source directory fact
  ansible.builtin.set_fact:
    libpri_source_dir: "{{ (libpri_dirs.files | sort(attribute='path') | last).path }}"

- name: Build LibPRI
  ansible.builtin.command:
    cmd: "make -j{{ asterisk_make_jobs }}"
    chdir: "{{ libpri_source_dir }}"
  changed_when: true

- name: Install LibPRI
  ansible.builtin.command:
    cmd: make install
    chdir: "{{ libpri_source_dir }}"
  changed_when: true
