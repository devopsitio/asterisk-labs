---
- name: Download Asterisk source tarball
  ansible.builtin.get_url:
    url: "{{ asterisk_tarball_url }}"
    dest: "{{ asterisk_tarball_path }}"
    mode: "0644"

- name: Extract Asterisk source
  ansible.builtin.unarchive:
    src: "{{ asterisk_tarball_path }}"
    dest: "{{ asterisk_build_base }}"
    remote_src: true
    creates: "{{ asterisk_source_dir }}/configure"

- name: Download chan_sip reinclude script
  ansible.builtin.get_url:
    url: "{{ asterisk_chan_sip_reinclude_url }}"
    dest: "{{ asterisk_chan_sip_reinclude_script }}"
    mode: "0755"
  when: asterisk_enable_chan_sip | bool

- name: Reinclude chan_sip into Asterisk source tree
  ansible.builtin.command:
    cmd: "{{ asterisk_chan_sip_reinclude_script }}"
    chdir: "{{ asterisk_source_dir }}"
    creates: "{{ asterisk_source_dir }}/channels/chan_sip.c"
  register: chan_sip_reinclude
  when: asterisk_enable_chan_sip | bool

- name: Reconfigure Asterisk after chan_sip was added
  ansible.builtin.command:
    cmd: ./configure --with-jansson-bundled --with-pjproject-bundled
    chdir: "{{ asterisk_source_dir }}"
  changed_when: true
  when:
    - asterisk_enable_chan_sip | bool
    - chan_sip_reinclude is changed or asterisk_force_rebuild | bool

- name: Download MP3 source for Asterisk
  ansible.builtin.command:
    cmd: contrib/scripts/get_mp3_source.sh
    chdir: "{{ asterisk_source_dir }}"
    creates: "{{ asterisk_source_dir }}/addons/mp3"

#- name: Install Asterisk prereq packages
#  ansible.builtin.command:
#    cmd: contrib/scripts/install_prereq install
#    chdir: "{{ asterisk_source_dir }}"
#  changed_when: true

- name: Configure Asterisk build
  ansible.builtin.command:
    cmd: ./configure --with-jansson-bundled --with-pjproject-bundled
    chdir: "{{ asterisk_source_dir }}"
    creates: "{{ asterisk_source_dir }}/makeopts"

- name: Deploy saved menuselect.makeopts
  ansible.builtin.copy:
    src: "{{ asterisk_menuselect_makeopts_file }}"
    dest: "{{ asterisk_source_dir }}/menuselect.makeopts"
    owner: root
    group: root
    mode: "0644"
  when: asterisk_use_saved_menuselect | bool

# make menuselect is interactive.
# For automation we build with default menuselect options.
# If you need custom modules, save menuselect.makeopts and copy it before make.
- name: Build Asterisk
  ansible.builtin.command:
    cmd: "make -j{{ asterisk_make_jobs }}"
    chdir: "{{ asterisk_source_dir }}"
  changed_when: true

- name: Rebuild Asterisk after chan_sip was added to source tree
  ansible.builtin.command:
    cmd: "make -j{{ asterisk_make_jobs }}"
    chdir: "{{ asterisk_source_dir }}"
  changed_when: true
  when:
    - asterisk_enable_chan_sip | bool
    - chan_sip_reinclude is changed or asterisk_force_rebuild | bool

- name: Install Asterisk
  ansible.builtin.command:
    cmd: make install
    chdir: "{{ asterisk_source_dir }}"
    creates: /usr/sbin/asterisk

- name: Install Asterisk sample configs
  ansible.builtin.command:
    cmd: make samples
    chdir: "{{ asterisk_source_dir }}"
    creates: /etc/asterisk/asterisk.conf

- name: Reinstall Asterisk after chan_sip rebuild
  ansible.builtin.command:
    cmd: make install
    chdir: "{{ asterisk_source_dir }}"
  changed_when: true
  when:
    - asterisk_enable_chan_sip | bool
    - chan_sip_reinclude is changed or asterisk_force_rebuild | bool

- name: Install Asterisk systemd service
  ansible.builtin.command:
    cmd: make config
    chdir: "{{ asterisk_source_dir }}"
    creates: /etc/init.d/asterisk

- name: Install Asterisk logrotate config
  ansible.builtin.command:
    cmd: make install-logrotate
    chdir: "{{ asterisk_source_dir }}"
    creates: /etc/logrotate.d/asterisk

- name: Run ldconfig
  ansible.builtin.command:
    cmd: ldconfig
  changed_when: false

- name: Ensure Asterisk service is enabled
  ansible.builtin.service:
    name: asterisk
    enabled: true

- name: Check installed Asterisk version
  ansible.builtin.command:
    cmd: asterisk -V
  register: asterisk_version_check
  changed_when: false

- name: Show installed Asterisk version
  ansible.builtin.debug:
    var: asterisk_version_check.stdout
